# ros2_control controller configuration for Jazzy + Gazebo Harmonic

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Differential drive controller handles /cmd_vel → wheel velocities
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # Broadcasts all joint states on /joint_states
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Forward position commands to gripper joints
    gripper_controller:
      type: forward_command_controller/ForwardCommandController

# ── Diff drive parameters ─────────────────────────────────────────
diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.164       # metres between wheel centres
    wheel_radius: 0.033           # metres

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.25
    linear.x.min_velocity: -0.25
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0

# ── Gripper forward command controller ───────────────────────────
gripper_controller:
  ros__parameters:
    joints:
      - gripper_tilt_joint
      - gripper_left_joint
      - gripper_right_joint
    interface_name: position