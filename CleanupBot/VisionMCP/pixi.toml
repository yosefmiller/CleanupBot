[workspace]
name = "mcp-vision-server"
version = "0.1.0"
description = "FastMCP vision server"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge", "pytorch"]
platforms = [
  { platform = "linux-64", cuda = "13.0" },
]

[dependencies]
python = ">=3.11,<3.13"
pytorch-gpu    = { version = "*", channel = "conda-forge" }
torchvision    = { version = "*", channel = "conda-forge" }

numpy  = ">=1.26,<3"
opencv = ">=4.10,<5"   # conda-forge build avoids duplicate ffmpeg
ros-jazzy-rclpy       = "*"
ros-jazzy-cv-bridge  = "*"
ros-jazzy-sensor-msgs = "*"
pixi-pycharm = ">=0.0.12,<0.0.13"
ros-jazzy-nav-msgs = ">=5.3.8,<6"
transformers = "<4.45"
einops = ">=0.8.2,<0.9"
timm = ">=1.0.30,<2"
scipy = ">=1.18.1,<2"

[pypi-dependencies]
mcp          = "<2.0.0"
ultralytics  = ">=8.3,<9"
httpx        = ">=0.27,<1"
openai-clip = ">=1.0"       # required by YOLOWorld text-embedding backbone
typesafe-sdk = ">=0.7.5, <0.8"

[tasks]
serve      = "python mcp_vision_server.py"
check-cuda = "python -c \"import torch; print(torch.__version__); print('CUDA:', torch.cuda.is_available())\""
